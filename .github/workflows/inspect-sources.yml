name: Inspect public data sources
on:
  workflow_dispatch:
  push:
    branches: [main]
    paths: ['scripts/inspect-public-sources.mjs', '.github/workflows/inspect-sources.yml']
permissions:
  contents: read
jobs:
  inspect:
    runs-on: ubuntu-latest
    timeout-minutes: 4
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-node@v6
        with:
          node-version: '24'
      - run: node scripts/inspect-public-sources.mjs
